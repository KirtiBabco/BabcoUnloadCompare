name: Retire approved Azure resources 2026-10-02

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retire-approved-20261002.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: d2865f7f-3cb8-4045-9750-6e569c6349b5
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RG: rg-babco-rnd-sandbox
  WORKSPACE_RG: ai_appi-resolvedesk-kirti20260807_2e3d427a-f229-4ba6-8532-d5c341e6cf2b_managed

jobs:
  retire-approved:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login with temporary repo-bound OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SUB="$(az account show --query id -o tsv)"
          test "$ACTUAL_SUB" = "$AZURE_SUBSCRIPTION_ID"

          KEEP_IDS=(
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-resolvedesk-kirti20260810"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/serverFarms/plan-resolvedesk-kirti20260810"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-babco-unloadcompare-0e27b0b7-260818"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Sql/servers/sql-babco-unloadcompare-0e27b0b7-260818"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/cae-babco-hrms-rnd"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/managedEnvironment-rgbabcorndsandb-87e7"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/price"
          )

          for id in "${KEEP_IDS[@]}"; do
            az resource show --ids "$id" >/dev/null
          done

          PLAN07="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/serverfarms/plan-resolvedesk-kirti20260807"
          PLAN07_APPS="$(az webapp list -g "$RG" --query "[?serverFarmId=='$PLAN07'].name" -o tsv)"
          test "$PLAN07_APPS" = "app-resolvedesk-kirti20260807"

          UNEXPECTED="$(az sql db list -g "$RG" -s sql-resolvedesk-kirti20260807 --query "[?name!='master' && name!='ResolveDeskDb'].name" -o tsv)"
          test -z "$UNEXPECTED"
          az sql db show -g "$RG" -s sql-resolvedesk-kirti20260807 -n ResolveDeskDb >/dev/null

          UNEXPECTED="$(az sql db list -g "$RG" -s sql-babco-unloadcompare-0e27b0b7-260814 --query "[?name!='master' && name!='BabcoUnloadCompareDb'].name" -o tsv)"
          test -z "$UNEXPECTED"
          az sql db show -g "$RG" -s sql-babco-unloadcompare-0e27b0b7-260814 -n BabcoUnloadCompareDb >/dev/null

          WS_COUNT="$(az resource list -g "$WORKSPACE_RG" --query "length(@)" -o tsv)"
          test "$WS_COUNT" = "1"
          az resource show --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.OperationalInsights/workspaces/managed-appi-resolvedesk-kirti20260807-ws" >/dev/null

          CURRENT_SETTINGS="$(az webapp config appsettings list -g "$RG" -n app-babco-unloadcompare-0e27b0b7-260818 -o json)"
          CURRENT_CONN="$(az webapp config connection-string list -g "$RG" -n app-babco-unloadcompare-0e27b0b7-260818 -o json)"
          if printf '%s\n%s' "$CURRENT_SETTINGS" "$CURRENT_CONN" | grep -qi "stunload0e27b0b7260814"; then
            echo "Safety stop: KEEP Unload Aug 18 still references old Aug 14 storage."
            exit 31
          fi

          echo "Safety checks passed."

      - name: Delete exact approved RETIRE resources
        shell: bash
        run: |
          set -euo pipefail

          delete_id () {
            local label="$1"
            local id="$2"
            if az resource show --ids "$id" >/dev/null 2>&1; then
              echo "Deleting: $label"
              az resource delete --ids "$id"
            else
              echo "Already absent: $label"
            fi
          }

          P="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers"

          delete_id "Unload stager container app" "$P/Microsoft.App/containerApps/ca-unload-stager-260814"
          delete_id "hello-8811 container app" "$P/Microsoft.App/containerApps/hello-8811"

          delete_id "Unload Aug 14 App Service" "$P/Microsoft.Web/sites/app-babco-unloadcompare-0e27b0b7-260814"
          delete_id "Unload Aug 14 Static Web App" "$P/Microsoft.Web/staticSites/BabcoUnloadCompare"
          delete_id "Unload Aug 14 SQL server and database" "$P/Microsoft.Sql/servers/sql-babco-unloadcompare-0e27b0b7-260814"
          delete_id "Unload Aug 14 storage" "$P/Microsoft.Storage/storageAccounts/stunload0e27b0b7260814"

          delete_id "ResolveDesk Aug 7 App Service" "$P/Microsoft.Web/sites/app-resolvedesk-kirti20260807"
          delete_id "ResolveDesk Aug 7 App Service plan" "$P/Microsoft.Web/serverFarms/plan-resolvedesk-kirti20260807"
          delete_id "ResolveDesk Aug 7 SQL server and database" "$P/Microsoft.Sql/servers/sql-resolvedesk-kirti20260807"
          delete_id "ResolveDesk Aug 7 smart detector alert" "$P/microsoft.alertsmanagement/smartDetectorAlertRules/Failure Anomalies - appi-resolvedesk-kirti20260807"
          delete_id "ResolveDesk Aug 7 Application Insights" "$P/Microsoft.Insights/components/appi-resolvedesk-kirti20260807"

          W="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.OperationalInsights/workspaces/managed-appi-resolvedesk-kirti20260807-ws"
          delete_id "ResolveDesk Aug 7 dedicated Log Analytics workspace" "$W"

      - name: Verify retirement and KEEP resources
        shell: bash
        run: |
          set -euo pipefail

          MUST_BE_ABSENT=(
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/ca-unload-stager-260814"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/hello-8811"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-babco-unloadcompare-0e27b0b7-260814"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/staticSites/BabcoUnloadCompare"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Sql/servers/sql-babco-unloadcompare-0e27b0b7-260814"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Storage/storageAccounts/stunload0e27b0b7260814"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-resolvedesk-kirti20260807"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/serverFarms/plan-resolvedesk-kirti20260807"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Sql/servers/sql-resolvedesk-kirti20260807"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Insights/components/appi-resolvedesk-kirti20260807"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.OperationalInsights/workspaces/managed-appi-resolvedesk-kirti20260807-ws"
          )

          for id in "${MUST_BE_ABSENT[@]}"; do
            for attempt in $(seq 1 24); do
              if ! az resource show --ids "$id" >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            if az resource show --ids "$id" >/dev/null 2>&1; then
              echo "Deletion verification failed: $id"
              exit 40
            fi
          done

          KEEP_IDS=(
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-resolvedesk-kirti20260810"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/serverFarms/plan-resolvedesk-kirti20260810"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/app-babco-unloadcompare-0e27b0b7-260818"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Sql/servers/sql-babco-unloadcompare-0e27b0b7-260818"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/cae-babco-hrms-rnd"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/managedEnvironment-rgbabcorndsandb-87e7"
            "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/price"
          )
          for id in "${KEEP_IDS[@]}"; do
            az resource show --ids "$id" >/dev/null
          done

          echo "Approved RETIRE resources are absent and KEEP resources are present."

      - name: Remove temporary cleanup identity and RBAC
        if: success()
        shell: bash
        run: |
          set +e

          # Remove stale role assignments from the first temporary identity.
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.Authorization/roleAssignments/d61535a7-f087-4ccf-8876-5d730b1682d4"
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.Authorization/roleAssignments/b02d44e7-ae4e-49bc-8bc0-e76f01799381"
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Authorization/roleAssignments/71f08e62-3e2d-4bf1-9ed1-c65d3daf0d02"
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Authorization/roleAssignments/aa0f94a4-6d7d-4f96-94cf-7d602806b6fb"

          # Remove temporary workspace-scoped roles while the cleanup identity is still alive.
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.Authorization/roleAssignments/9b9f2022-574f-4468-8e97-38e4a8b6c527"
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$WORKSPACE_RG/providers/Microsoft.Authorization/roleAssignments/1c6d4bdd-c59b-4a6f-8658-a9af8877ab52"

          # Delete the temporary cleanup identity. The federated credential is removed with it.
          UAMI="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-kirti-retire-approved-20261002"
          if az resource show --ids "$UAMI" >/dev/null 2>&1; then
            az resource delete --ids "$UAMI"
          fi

          # Best-effort removal of the final two main-RG role assignments using the already-issued access token.
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Authorization/roleAssignments/4e2c4470-c2e4-4cef-916e-13a0791012f1"
          az role assignment delete --ids "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Authorization/roleAssignments/d1ac7a73-caf9-44a0-bb35-44bb9dba20bd"

          exit 0

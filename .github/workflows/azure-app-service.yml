name: Build and deploy Babco Unload Compare to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PROJECT_PATH: BabcoUnloadCompare.Web.csproj
  SOLUTION_PATH: BabcoUnloadCompare.sln
  PUBLISH_DIR: ${{ github.workspace }}\publish
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  AZURE_WEBAPP_NAME: app-babco-unloadcompare-0e27b0b7-260818
  LIVE_URL: https://app-babco-unloadcompare-0e27b0b7-260818.azurewebsites.net/UnloadCompare.aspx

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "${{ env.SOLUTION_PATH }}" -PackagesDirectory packages

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and stage ASP.NET WebForms application
        shell: pwsh
        run: |
          if (Test-Path "${{ env.PUBLISH_DIR }}") { Remove-Item "${{ env.PUBLISH_DIR }}" -Recurse -Force }
          msbuild "${{ env.PROJECT_PATH }}" /m /p:Configuration=Release /p:DeployOnBuild=true
          $packageTmp = Join-Path "${{ github.workspace }}" "obj\Release\Package\PackageTmp"
          if (-not (Test-Path "$packageTmp\Web.config")) { throw "MSBuild PackageTmp Web.config was not produced." }
          New-Item -ItemType Directory -Path "${{ env.PUBLISH_DIR }}" -Force | Out-Null
          Copy-Item "$packageTmp\*" "${{ env.PUBLISH_DIR }}" -Recurse -Force
          if (-not (Test-Path "${{ env.PUBLISH_DIR }}\Web.config")) { throw "Staged publish Web.config was not produced." }

          $logoDir = Join-Path "${{ env.PUBLISH_DIR }}" "Content"
          New-Item -ItemType Directory -Path $logoDir -Force | Out-Null
          $logoPath = Join-Path $logoDir "babco-labs-logo.svg"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/babcofoods/Email-Teams-Follow-Up-Capture/main/app/assets/babco-labs-logo.svg" -OutFile $logoPath -UseBasicParsing
          if (-not (Test-Path $logoPath)) { throw "Canonical Babco Labs SVG was not downloaded." }
          $logoText = Get-Content $logoPath -Raw
          if ($logoText -notmatch '<svg' -or $logoText.Length -lt 1000) { throw "Canonical Babco Labs SVG validation failed." }

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.PUBLISH_DIR }}

  publish-deployment-package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled website
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: publish

      - name: Create deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/Content/babco-labs-logo.svg
          grep -Fq '<svg' publish/Content/babco-labs-logo.svg
          cd publish
          zip -qr ../webapp-publish.zip .
          cd ..
          test -s webapp-publish.zip

      - name: Publish deploy ZIP to deployment-artifacts branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir deploy-branch
          mv webapp-publish.zip deploy-branch/webapp-publish.zip
          printf 'Source commit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-branch/build.txt
          cd deploy-branch
          git init
          git checkout -b deployment-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp-publish.zip build.txt
          git commit -m "Publish compiled WebForms deployment package"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment-artifacts

  deploy:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.PUBLISH_DIR }}

      - name: Check Azure OIDC secret readiness
        id: oidc
        shell: bash
        env:
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          echo "client=${HAS_CLIENT}" >> "$GITHUB_OUTPUT"
          echo "tenant=${HAS_TENANT}" >> "$GITHUB_OUTPUT"
          echo "subscription=${HAS_SUBSCRIPTION}" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        id: azurelogin
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Recover and deploy directly to wwwroot
        id: recovery
        if: steps.azurelogin.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az webapp config appsettings delete -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" --setting-names BabcoSupportConnectionString | Out-Null
          az webapp config appsettings delete -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" --setting-names WEBSITE_RUN_FROM_PACKAGE WEBSITE_RUN_FROM_ZIP | Out-Null
          az webapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false | Out-Null
          az webapp start -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" | Out-Null

          $zipPath = Join-Path $env:RUNNER_TEMP 'babco-webapp.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $zipPath -Force

          $token = az account get-access-token --query accessToken -o tsv
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Azure access token was empty.' }
          $headers = @{ Authorization = "Bearer $token" }
          $scm = "https://$($env:AZURE_WEBAPP_NAME).scm.azurewebsites.net/api/zip/site/wwwroot/"
          Invoke-WebRequest -Uri $scm -Method Put -Headers $headers -ContentType 'application/zip' -InFile $zipPath -UseBasicParsing | Out-Null

          az webapp restart -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" | Out-Null
          Start-Sleep -Seconds 10

          $code = 0
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $env:LIVE_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
              $code = [int]$r.StatusCode
            }
            catch {
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $code = [int]$_.Exception.Response.StatusCode
              } else {
                $code = 0
              }
            }
            Write-Host "Health $i/30 HTTP $code"
            if ($code -in 200,301,302) { break }
            Start-Sleep -Seconds 6
          }
          "HTTP_CODE=$code" | Out-File -FilePath $env:RUNNER_TEMP\azure-result.txt -Encoding ascii
          if ($code -notin 200,301,302) { throw "Application health check failed with HTTP $code" }

      - name: Publish deployment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_OUTCOME: ${{ steps.azurelogin.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          CLIENT_PRESENT: ${{ steps.oidc.outputs.client }}
          TENANT_PRESENT: ${{ steps.oidc.outputs.tenant }}
          SUBSCRIPTION_PRESENT: ${{ steps.oidc.outputs.subscription }}
        run: |
          set -euo pipefail
          mkdir status-branch
          HTTP_CODE="unknown"
          if [ -f "$RUNNER_TEMP/azure-result.txt" ]; then
            HTTP_CODE="$(sed -n 's/^HTTP_CODE=//p' "$RUNNER_TEMP/azure-result.txt" | tr -d '\r')"
          fi
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'AZURE_CLIENT_ID present: %s\n' "${CLIENT_PRESENT:-unknown}"
            printf 'AZURE_TENANT_ID present: %s\n' "${TENANT_PRESENT:-unknown}"
            printf 'AZURE_SUBSCRIPTION_ID present: %s\n' "${SUBSCRIPTION_PRESENT:-unknown}"
            printf 'Azure login: %s\n' "${LOGIN_OUTCOME:-unknown}"
            printf 'Recovery deploy: %s\n' "${RECOVERY_OUTCOME:-unknown}"
            printf 'Live HTTP: %s\n' "${HTTP_CODE:-unknown}"
            printf 'Checked: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status-branch/status.txt
          cd status-branch
          git init
          git checkout -b deployment-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.txt
          git commit -m "Publish Azure recovery status"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment-status

name: Build and deploy Babco Unload Compare to Azure App Service

on:
  push:
    branches:
      - main
      - agent/azure-appservice-go-live
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_PATH: BabcoUnloadCompare.Web.csproj
  SOLUTION_PATH: BabcoUnloadCompare.sln
  PUBLISH_DIR: ${{ github.workspace }}\publish

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore "${{ env.SOLUTION_PATH }}" -PackagesDirectory packages
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build and stage ASP.NET WebForms application
        shell: pwsh
        run: |
          if (Test-Path "${{ env.PUBLISH_DIR }}") { Remove-Item "${{ env.PUBLISH_DIR }}" -Recurse -Force }
          msbuild "${{ env.PROJECT_PATH }}" /m /p:Configuration=Release /p:DeployOnBuild=true
          $packageTmp = Join-Path "${{ github.workspace }}" "obj\Release\Package\PackageTmp"
          if (-not (Test-Path "$packageTmp\Web.config")) { throw "MSBuild PackageTmp Web.config was not produced." }
          New-Item -ItemType Directory -Path "${{ env.PUBLISH_DIR }}" -Force | Out-Null
          Copy-Item "$packageTmp\*" "${{ env.PUBLISH_DIR }}" -Recurse -Force
          if (-not (Test-Path "${{ env.PUBLISH_DIR }}\Web.config")) { throw "Staged publish Web.config was not produced." }
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    environment: production
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.PUBLISH_DIR }}
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
